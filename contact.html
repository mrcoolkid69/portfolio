<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.png">
    
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="defaults.css" />
    <script src="styles.js" defer></script>
    <style>
        .form-container {
            max-width: 500px;
            height: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #54c0ff;
            background-image: linear-gradient(to bottom right, #54c0ff, #2f7ef3);
            transition: 0.3s;
        }

        .form-container:hover {
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 1);
        }

        .form-container label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 20px;
        }

        .form-container input,
        .form-container textarea {
            width: 80%;
            background-image: linear-gradient(to bottom right, #0059ff, #258dee);
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
            transition: 0.3s;

        }

        .form-container:hover input:focus,
        .form-container textarea:focus {
            outline: none;
            border: 2px solid #0044fe;
            box-shadow: 0 0 15px #0044fe;
        }

        .form-container button {
            padding: 5px 10px;
            background-color: #0044fe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 20px;
        }

        .form-container button:hover {
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
        }

        .form-container button:active {
            transform: scale(0.95);
        }
    </style>

</head>

<body>
    <nav>
        <div class="navContainer" >
            <div class="button"></div>
            <div class="cover">Home</div>
        </div>
        <div class="navContainer">
            <div class="button"></div>
            <div class="cover">Websites</div>
        </div>
        <div class="navContainer" id = "active">
            <div class="button"></div>
            <div class="cover">Contact</div>
        </div>
    </nav>
    <main>
        <header>Contact Me</header>
        <subheader>Reach out to me using the form below for any inquiries about websites or job offerings</subheader>
        <div class="form-container">
            <form action="https://formspree.io/f/mzeblzpg" method="POST">
                <label>
                    Your email:
                    <br>
                    <input type="email" name="email">
                </label>
                <br>
                <br>
                <label>
                    Your message:
                    <br>
                    <textarea name="message"></textarea>
                </label>
                <br>
                <button type="submit">Send</button>
            </form>
        </div>

        

    </main>
    <footer></footer>
</body>

</html>
